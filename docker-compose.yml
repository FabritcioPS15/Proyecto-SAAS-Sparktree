   #/    - REDIS_HOST=redis
   #/    - REDIS_PORT=6379
   #/   - REDIS_URL=redis://redis:6379
    #/   - USE_REDIS=true
    #/   - CHOKIDAR_USEPOLLING=true
  #/   volumes:
   #/    - ./backend/src:/app/src
